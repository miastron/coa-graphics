; ============================================================================
; General
; ============================================================================
; CoAGraphics settings. Changes apply within a second while the game runs,
; except Enable, EngineHooks and LightStay, which need a client restart.
[CoAGraphics]
Enable=1
EngineHooks=1

; 1 = keep point lights (torches, braziers, spell lights) enabled while their model is not drawn, as patch No. 70
; "lightstay" of St0ny's AIO WoW EXE Patcher does: one byte of the client's light query (je -> jmp at 0x81E548),
; written in memory once at start-up after checking the client's code, and accepted when the exe already carries
; it. Needs EngineHooks=1; the log says whether it was applied. Without it the client switches a light off as soon
; as its source leaves the frame, on the figure beside it and in the fog. A source that moves while off-screen
; keeps lighting its last drawn spot until it is drawn again.
; 0 = the client's own behaviour
LightStay=1


; ============================================================================
; Settings window
; ============================================================================
; In-game settings window, shown and hidden with OverlayKey. It changes the settings below live; its Save button
; writes the changed ones back to this file and keeps the comments. 0 = off (turning it on again needs a client
; restart; with 0 at start-up the game window is left untouched)
Overlay=1

; F1-F24, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock, a letter or a digit, with optional Ctrl+,
; Shift+ and Alt+ in front
OverlayKey=Ctrl+F7


; ============================================================================
; Volumetric fog
; ============================================================================
; 1 = quarter resolution, 16 steps; 2 = half resolution, 24 steps; 3 = half resolution, 32 steps
Quality=2

; Global density multiplier, then the layers used where no Classic data exists: distance haze, low
; ground mist, and the distance fog that replaces the stock fog (FarFog). With Classic data Haze, FarFog and GroundFog
; scale its haze, far wall and ground fog layers; 1.0, 1.0 and 0.6 keep them as authored
Density=1.0
Haze=1.0
GroundFog=0.6
FarFog=1.0

; World-anchored density variation in scene layers; 0 keeps the authored density smooth.
; Amount 0..1 varies density between 1-amount and 1+amount without changing its spatial mean.
; Scale 0.001..1 controls patch size (larger is smaller); wind 0..10 drifts along world +X in yd/s.
; The distance fog remains smooth to preserve the far-clip transition.
NoiseAmount=0.15
NoiseScale=0.025
NoiseWindSpeed=0.5

; 1 = drifting fog banks where the Classic layers carry the modern client's noise (mostly storms); it thins those
; layers to about half their density on average, and the variation above does not apply to them.
; 0 = off, the variation above applies instead and storms keep their full density
ClassicNoise=0

; 1 = replace the client's linear fog with the volumetric distance fog, 0 = keep the stock fog
StockFog=1

; 1 = fog particles, spell effects and other see-through models by their own distance, as the stock client does; this
; is the default. The fog is drawn after the water and before them, each of them gets a linear fog fitted to the
; volumetric fog within 100 yd, or over a longer range up to where the fog halves the light and at most the far clip
; when the fog in those 100 yd is thin (with almost no fog none at all), and the sun and moon glare is drawn just
; before the fog. Beyond the fitted range the same line is extended, so distant effects and models fading in or out
; can be fogged noticeably more or less than the scene around them (by up to about 0.4 of their visibility between
; 100 and 600 yd in tests), and past the line's end, 500 to 900 yd in tests, they are fully fogged: distant glows
; vanish. Lamp glows and other effects the client draws without fog take the same line, so they fade with distance
; instead of shining through the fog. World-name text and lightning, missile and barrier effects then look as in the
; stock client, weather keeps its own 70-75 yd fade as in the stock client, and see-through parts of buildings, such
; as windows, still take the fog of the scene behind them. Applies above water while StockFog=1, without a debug view
; or the sun marker.
; 0 = the fallback if distant effects look wrongly fogged: the fog is drawn once after the world and before the
; world-name text, so see-through effects take the fog of the scene behind them
TransparentFog=1

; 1 = use the Classic client's fog layers where its lights cover the map, 0 = derived layers everywhere
DataMode=1

; Density per region, on top of Density: the old continents with their dungeons and every other map (Azeroth),
; Outland and Northrend
AzerothDensity=1.0
OutlandDensity=0.15
NorthrendDensity=0.15
; Classic never had Outland or Northrend; fogdata.bin carries their own client lights, converted with the layers of
; the most alike Classic light. 1 = use them, 0 = derived layers there, with the client's glow and no colour grading
OutlandClassicFog=1
NorthrendClassicFog=1
; How much the fog takes the hue of the client's current fog colour (which blends the land into the sky and follows
; the weather) at the fog's own brightness, 0..1: 1 = that hue, 0 = the colours in fogdata.bin
AzerothSkyColor=0.0
OutlandSkyColor=0.0
NorthrendSkyColor=0.0

; 1 = scatter and blend in linear light like the modern client, with a soft highlight roll-off; 0 = gamma
ColorSpace=1

; In-scattered sun light by day (the halo around it) and ambient fog brightness
SunScatter=1.0
; In-scattered moon light at night, on its own (SunScatter does not change it); 1 = as bright as the sun's halo
MoonScatter=0.2
Ambient=1.0
Exposure=1.0

; Brightness of the Classic layers (1 = as authored; the modern client applies no exposure to its fog)
ClassicExposure=1.0

; How the Classic layers scatter the sun and moon: 0 = the phase peaks at 1 toward the light;
; 1 = energy-normalised, as the authored intensities suggest the modern client does: the horizon band of the far,
; evenly scattering layers about 12 times dimmer, the halo of strongly forward layers larger and much brighter
ClassicPhase=0


; ============================================================================
; Lights
; ============================================================================
; Scatter up to eight world point lights in view into the fog; intensity range 0..8. 1.0 looks about the same in every
; zone, hour and weather: the glow is scaled each frame by the fog in front of you (thin fog gets more) and by how
; bright the sky is (bright daylight gets more), so raise or lower it only to taste
LocalLights=1
LocalLightIntensity=1.0

; Local light intensity per region, 0..128 (the settings window's sliders reach 96), on top of LocalLightIntensity.
; Outland's and Northrend's fog is far thinner than the old world's, so their lamps need more to glow alike there; a
; higher value also lets each lamp's glow reach further
AzerothLocalLights=1.0
OutlandLocalLights=8.0
NorthrendLocalLights=8.0

; How every point light scatters in the fog (one value for all lights, as the modern client does), -0.9..0.9:
; 0 = evenly in every direction; toward 0.9 mostly the fog between you and the light; below 0 the fog behind the
; light, steeply brighter toward -0.9. The modern client's value is not known; 0.3 is a calibration
LocalLightPhase=0.3

; 1 = decode the point and spell light colours with a gamma of 2.2 before they scatter (needs ColorSpace=1);
; 0 = use the colours as they are, which makes warm lights less saturated
DecodeLightColours=1

; 1 = a light fades out with its lamp or fire when the game stops drawing that object in view (too far away for your
; Environment Detail, or hidden), and returns with it; lights just outside the view stay on (see LightStay).
; 0 = every light in the client's table shines at any distance
LightsFollowObjects=1

; Let glowing spell effects (fire, frost, arcane, shadow, shields...) light the fog around them in their own colour.
; They share the eight light slots with the world's lights and need LocalLights=1; intensity range 0..8.
; SpellLightIntensity alone sets their brightness and reach: LocalLightIntensity and the region values above
; are for the world's lamps only. Their glow is scaled by the fog and the sky like the lamps' (1.0 = alike
; everywhere). A flying spell's light travels with its head, not with the trail behind it, and a small glow shines at
; half the power of a large one
SpellLights=1
SpellLightIntensity=1.0

; Let the same eight point and spell lights also light the ground, walls and models around them (no shadows), 0..2,
; scaled each frame by how bright the sky is (1.0 looks about the same at noon and at midnight); the light fades out
; by itself in a bright zone or in daylight, where it would add too little to show. Needs LocalLights=1.
; SurfaceLights is for the world's lamps (LocalLightIntensity scales it too), SpellSurfaceLights for the spell lights
; (SpellLightIntensity does not scale it). 0 = off. With WorldShadows=1 a light also fills the shadows the game's
; shadow maps cast on the ground (characters, trees, buildings) instead of leaving them as dark under the light as
; beside it
SurfaceLights=1.0
SpellSurfaceLights=0.5


; ============================================================================
; Interiors
; ============================================================================
; Fade outdoor layers and sunlight using the camera's building/cave transition.
; InteriorDensity is the fraction of outdoor layer density retained indoors (0..1).
; InteriorFarFog is the fraction of native distance-fog density retained indoors (0..1).
; 1.0 preserves native interior distance fog; lower values (0.15 to 0.4 in testing) clear dungeon haze.
; This follows the camera, not individual rooms along each ray.
InteriorAware=1
InteriorDensity=0.15
InteriorFarFog=1.0


; ============================================================================
; Light shafts, shadows and god rays
; ============================================================================
; Shadowed in-scattering: terrain, buildings and trees block the sun or moon light in the fog, so it shines through
; only where the light reaches (light shafts). Terrain blocks it from the map's heights around the camera, in view
; or not; buildings and trees are traced through the depth of the image where no shadow map covers. With the sun
; or moon low in the sky the client's shadow maps fade out between 25 and 35 degrees from their own direction, and only
; the terrain and the depth of the image block it.
LightShafts=1

; Use the client's world shadow maps when available, so casters outside the view block the light too. Needs
; LightShafts=1 and the client's shadow rendering; where no map covers, the depth of the image is traced instead.
; The lights on surfaces read the same maps, with or without LightShafts, to fill the shadows on the ground
WorldShadows=1

; Shafts of light through gaps in trees, buildings and terrain in front of the sun, 0 = off. They only add light where
; such things stand in front of the sun: an open sky, its clouds included, gets none; its glow is SunScatter's
GodRays=0


; ============================================================================
; Colour and glow
; ============================================================================
; 1 = pre-compensate the fog for the client's full-screen glow (ffxGlow), which otherwise bleaches bright
; fog around the sun to white. Only ColorSpace=1 compensates the fog itself, while it blends over a copy of the
; scene (CoAGraphics.log: "fog blend: linear over a scene copy"); otherwise only the god rays are compensated. 0 = off
GlowCompensation=1

; 1 = the modern client's glow amount (LightParams.Glow, 0 on most continent lights) where Classic lights cover
; the camera, fading back to the client's own glow at the edge of that coverage; it replaces the client's amount,
; Ascension's ambientGlow included, but never the ghost view's. 0 = the client's own glow
ForeverGlow=0

; Strength of the modern client's colour curve for the lights around the camera, 0..1: brighter midtones, and the
; brightest highlights clipped to white. It grades the 3D view after the glow, names drawn in the world included;
; the interface, the ghost view and the view under water are not graded. 0 = off
ColorGrading=0


; ============================================================================
; Image quality, view range and depth
; ============================================================================
; Bloom, 0..1: a soft halo of light around the brightest parts of the 3D view (the sun, bright sky, spells and
; lamps) at the end of the world render, names drawn in the world included, before the interface. It adds to the
; client's own full-screen glow (see ForeverGlow above). 0 = off
Bloom=0

; Anisotropic filtering of the game's textures: 0 = the game's own, 2, 4, 8 or 16 = at least that many samples
; on every mipmapped texture, up to what the graphics card supports. The game's Texture Filtering option only
; reaches models; the ground, buildings and grass always stay trilinear and turn blurry at grazing angles
AnisotropicFiltering=16

; View distance in yards on the continents (Eastern Kingdoms, Kalimdor, Outland, Northrend), which Ascension
; caps at 791. Up to 1583 (the engine's limit, used in instances), within the client's own farclip setting.
; 0 = leave the client's cap. Turning it on when it was 0 at start-up needs a client restart; other changes,
; including 0, apply at the next farclip change, map load or zone change (e.g. "/console farclip 1583"), and
; raising it shows a loading screen at that moment. Costs about four times the loaded terrain.
FarClipMax=1583

; Fog range in yards: how far sky rays are integrated and the scale of the Classic distance curves
MaxDistance=5000

; History weight of the temporal filter, 0 = off
Temporal=0.85

; Keep the effect while the camera is under water
Underwater=0

; Let water surfaces write depth so water is fogged by its own distance (always on while modern water is drawn)
LiquidDepth=1

; 1 = keep the game's Multisampling video option (smoother edges) when the graphics driver can copy the
; multisampled depth for the fog and water: NVIDIA through NVAPI, AMD and Intel through RESZ. The copy is tested
; when the game creates its display; if it fails, multisampling stays off and CoAGraphics.log says why.
; 0 = multisampling off, as before. The game lists its Multisampling choices once per start, so turning this on
; takes effect after restarting the game; turning it off applies the next time the game resets its display, for
; example after changing Multisampling or the resolution in its Video options
Multisampling=1

; 1 = SMAA antialiasing of the 3D view at the end of the world render, names drawn in the world included, before
; the interface: it smooths jagged edges, also those the game's multisampling misses (leaves, grass, fences,
; hair), and works with or without multisampling. 0 = off
Antialiasing=0

; Contrast-adaptive sharpening of the 3D view, 0..1, at the end of the world render, names drawn in the world
; included, before the interface: it brings back detail that blurry textures, antialiasing and the fog soften,
; more in flat areas than at edges that already have contrast. 0 = off
Sharpening=0

; 1 = a small arrow on the rim of your target's ground circle points the way the target faces, in the circle's
; colour, as in the modern game. 0 = the plain circle
TargetArrow=1


; ============================================================================
; Water
; ============================================================================
; Modern water: lakes, rivers, the sea and indoor pools are shaded like the modern client, with moving waves,
; refraction, foam, sun highlights and reflections. Magma and slime keep the client's look. While modern water is
; drawn (Water=1, waterdata.bin installed, camera above water), water surfaces write depth whatever LiquidDepth says.
; 1 = on, 0 = the client's own water
Water=1

; 1 = low: 128 waves, sky reflections only; 2 = medium: 256 waves, scene reflections;
; 3 = high: 256 waves, finer scene reflections
WaterQuality=2

; How many times a second the waves are recomputed (20 by default); 0 = every frame. Between updates the water blends
; smoothly from the previous wave shape to the latest one, one update behind, so the waves keep moving every frame. The
; blend still costs part of an update (about 0.5 ms against 2.6 ms for an update at WaterQuality=2 on a Radeon 780M
; at 1280x688). Below your frame rate the setting changes nothing: every frame is then an update
WaterWaveRate=20

; Wave height, 0..2; 0 = flat water
WaterWaves=1.0

; Wind that drives the waves, 0.5..10; stronger wind makes longer, rougher waves
WaterWind=2.0

; Foam on wave crests, 0..2; 0 = no crest foam
WaterFoam=1.0

; Foam along shores and in shallow water, 0..2; 0 = none. Its band is measured by the water's depth, so it looks the
; same from a low camera as from above. Rivers use the lake's shore foam
WaterShoreFoam=1.0

; Small waves washing in and out at the waterline, 0..2: the thin water at the edge drains back and runs in again
; with a foam line at its front, every few seconds on lakes, slower and wider on the sea, faintly on rivers, out of
; step along the coast. The waterline can only draw back from where the client draws it, not climb the beach.
; 0 = a still waterline
WaterShoreWaves=1.0

; Reflections of the sky and the scene, 0..2; 0 = none
WaterReflections=1.0

; Highlight of the sun or moon on the water, 0..4; 0 = none
WaterSpecular=1.0

; How far you see into the water, 0.25..4; larger is clearer
WaterClarity=1.0

; How much the zone's own water colours (from the client's day and night lights) tint the water, 0..1;
; 0 = the modern colours only
WaterZoneColors=0.5

; Ripples and wakes where players, creatures, pets and mounts move through or jump into water, 0..2: a unit
; moving faster than the ripples spread (about 2.6 yd/s, a run or a swim) drags a thin V behind it, starting and
; stopping each send out one ring, a splash marks jumping in, and a unit standing still leaves the water calm
; with only a faint distortion at its feet. 0.5 is the default strength; 0 = none (no ripple simulation and no
; reading of the units around you)
WaterRipples=0.5

; The client's own flat splash discs and white V-shaped wake trails: 0 = hidden while the modern water and its
; ripples are drawn (the client's waterRipples console value is held at 0 and put back when they stop; they stay
; when the ripples cannot run), 1 = keep them on top of the ripples. Hiding them is all or nothing: ripples reach
; only about 24 yd around your character (10 yd at WaterQuality=1) and the 32 nearest units, and only on the
; modern water, so a unit farther away or in a liquid the client draws itself leaves no wake while they are hidden
WaterClientSplashes=0

; 0 = off, 1 = wave normals, 2 = foam, 3 = transmittance, 4 = reflection, 5 = liquid class, 6 = ripples
WaterDebugView=0


; ============================================================================
; Trees
; ============================================================================
; Trees sway in the wind (no GPU cost: each placed tree's bone palette is built from a slightly tilted placement).
; 0 = trees stay still. Changes apply within a second while the game runs
TreeWind=1

; Tree wind: a heading and two travelling waves that tilt each model about its base. Heading of the primary
; wave in the world plane, degrees (0..360)
TreeWindDirection=35

; How fast the waves travel, yards per second (0..12)
TreeWindSpeed=3

; Tilt of the primary wave at the crown, degrees (0..6)
TreeWindAmplitude=0.6

; Length of the primary wave, yards (2..80)
TreeWindWavelength=26

; Tilt of the secondary cross swell, degrees (0..3)
TreeWindCrossAmplitude=0.22

; Length of the cross swell, yards (2..40)
TreeWindCrossWavelength=9

; Heading of the cross swell relative to the primary wave, degrees (0..180)
TreeWindCrossAngle=40

; Constant downwind lean, degrees (0..4)
TreeWindLean=0.25

; Spread of the sway between neighbouring models, 0..1; 0 = all sway alike
TreeWindVariance=0.5

; Depth of the slow gust modulation, 0..1; 0 = none
TreeWindGust=0.35

; Sway attenuation per yard of distance from the camera, 0..0.05; 0 = none
TreeWindDistanceFade=0

; Only map-placed models sway, never units, mounts or spell effects: 0 = off, 1 = on
TreeDoodadsOnly=1

; A model sways only if its name contains a live-tree word (tree, pine, oak, palm, birch ...): 0 = off, 1 = on
TreeMatchNames=1

; A model sways only if its bounds are tall and narrow (see TreeMinHeight and TreeMinAspect). Every enabled test
; must pass: 0 = off, 1 = on
TreeMatchTallThin=0

; Dead, bare, burnt and felled models (dead, stump, log, charred ...) stay still: 0 = off, 1 = on
TreeSkipDead=1

; Tall-model test: least model height, yards (0..40)
TreeMinHeight=6

; Tall-model test: least height over width (0.5..6)
TreeMinAspect=1.8

; Trees taller than this stay still, world yards (0..300); 0 = no limit
TreeMaxHeight=200

; Trees farther than this from the camera stay still, yards (0..500); 0 = no limit
TreeMaxDistance=0

; ============================================================================
; Bushes
; ============================================================================
; Bushes, ferns and hedges sway with their own wind, matched by name only: 0 = still, 1 = sway
BushWind=1

; Bush wind: a heading and two travelling waves that tilt each model about its base. Heading of the primary
; wave in the world plane, degrees (0..360)
BushWindDirection=35

; How fast the waves travel, yards per second (0..12)
BushWindSpeed=2

; Tilt of the primary wave at the crown, degrees (0..6)
BushWindAmplitude=0.5

; Length of the primary wave, yards (2..80)
BushWindWavelength=9

; Tilt of the secondary cross swell, degrees (0..3)
BushWindCrossAmplitude=0.25

; Length of the cross swell, yards (2..40)
BushWindCrossWavelength=5

; Heading of the cross swell relative to the primary wave, degrees (0..180)
BushWindCrossAngle=40

; Constant downwind lean, degrees (0..4)
BushWindLean=0.2

; Spread of the sway between neighbouring models, 0..1; 0 = all sway alike
BushWindVariance=0.6

; Depth of the slow gust modulation, 0..1; 0 = none
BushWindGust=0.4

; Sway attenuation per yard of distance from the camera, 0..0.05; 0 = none
BushWindDistanceFade=0

; Only map-placed models sway: 0 = off, 1 = on
BushDoodadsOnly=1

; Dead and bare bushes stay still: 0 = off, 1 = on
BushSkipDead=1

; Bushes farther than this from the camera stay still, yards (0..500); 0 = no limit
BushMaxDistance=0


; ============================================================================
; Grass
; ============================================================================
; Grass moves in the wind and parts around your character and every unit near it: the client's grass vertex shaders
; are reassembled with a motion block when the game starts, so the shader rewrite needs GrassWind=1 or GrassParting=1
; at start (and d3dcompiler_47.dll, which Windows ships). With it installed, the keys below apply within a second and
; 0 stops the motion. The wind itself (steady strength, gusts, direction, stronger in bad weather) comes from
; WindProfile.cdbc next to this file, per map and area; without the file one built-in profile applies everywhere.
; Scale of the whole wind, 0 = calm, 1 = as authored (0..4)
WindStrength=1

; 0 = grass stays still, 1 = sway
GrassWind=1

; Sway of the blade tip at wind strength 1, yards (0..2)
GrassWindAmplitude=0.35

; Extra shimmer of single blades, yards (0..1)
GrassWindFlutter=0.4

; How fast the shimmer runs, radians per second (0..20)
GrassWindFlutterSpeed=3

; Share of each blade, from the base, that never moves (0..0.9)
GrassWindAnchor=0.3

; Each kind of grass, flower and pebble bends from its own root to its own tip, measured from its model; pebbles and
; other flat doodads stay still, and GroundEffectDoodadWind.cdbc next to this file overrides single doodads (stiffness,
; no wind, no push, flipped, a root and tip of your own). 0 = every doodad bends by its texture coordinate as before
GrassModelBend=1

; Blades lean away from your character and every unit within 40 yards as they move through the grass: 0 = off, 1 = on
GrassParting=1

; How far blades lean away from a unit, yards (0..2)
GrassPartingForce=0.25

; Parting radius as a multiple of the unit's collision radius (0.5..6)
GrassPartingRadiusScale=4.5

; Smallest parting radius, yards (0.1..3)
GrassPartingMinRadius=1

; Extra parting radius factor while the unit is mounted (1..4)
GrassPartingMountedScale=2

; Plants drawn per plant the client places, near you (1..4). The client builds every plant on the CPU into buffers
; of limited size, and groundEffectDensity stops at 256, so this adds plants the client cannot: copies of its own
; grass drawn again on the GPU, each moved sideways by up to GrassDensitySpread in a direction that differs from
; plant to plant, and kept on the same ground slope. They come in gradually: from half of GrassDensityRadius out
; to the radius the plants lose their copies one by one, the last copy first, each plant sinking into the ground
; over GrassDensityFade yards, and none is left beyond the radius. Each copy costs one more draw of the grass of every chunk
; within its distance. Needs the grass shader rewrite (GrassWind=1, GrassParting=1 or
; GrassDensity above 1 at start) and the doodad hooks. 1 = the client's own density
GrassDensity=2

; Distance from the camera, in yards, over which the extra plants fade out by chunk (10..250)
GrassDensityRadius=150

; How far a copy lies from its plant, in yards (0.25..3). Large values put grass over paths and cliff edges
GrassDensitySpread=1

; Distance over which a plant grows out of the ground as you come closer, in yards (1..40). It is a distance, so
; the faster you move the faster plants grow: doubling it halves the speed
GrassDensityFade=32


; ============================================================================
; Snow
; ============================================================================
; Ground the zone paints with snow (a snow ground effect, or a texture named snow) gets a real layer of snow: the
; client's terrain is raised by it, so characters sink in and grass is buried, steep ground stays bare, and the snow
; spreads past the painted ground with ragged edges. The client's terrain shaders are reassembled when the game
; starts, so this needs Snow=1 at start (and d3dcompiler_47.dll); the keys below then apply within a second. It
; covers about 260 yards around the camera, fading out at the edge
Snow=1

; How deep the snow lies on flat ground, yards (0..0.6). Selection and spell circles on the ground are raised with it
SnowDepth=0.15

; Ground steeper than this holds no snow, degrees (10..80)
SnowMaxSlope=40

; Degrees below SnowMaxSlope over which the snow thins out (0..40)
SnowSlopeFade=15

; Depth variation, share of the depth (0..1): gentle drifts and lumps
SnowDrift=0.35

; How strongly the snow spreads past the painted snow ground with ragged edges (0..1); 0 = the client's own snow
; texture alone, raised
SnowEdges=1

; 0 = smooth edges .. 1 = ragged, patchy ones (0..1)
SnowBreakup=0.5

; Your character and the units near you (the 16 nearest within 30 yards) leave footprints in the snow as they walk
; on the ground: left and right prints, four tracks for mounts and four-legged beasts, a shallow scuff where the
; lifted foot drags between its prints, snow pushed up around them, and they fill back in over time: 0 = off, 1 = on.
; They are drawn by the terrain's own pixel shader, so they keep the client's snow, light and shadows
SnowFootprints=1

; Seconds a footprint takes to fill back in (2..300)
SnowFootprintSeconds=30

; Height of the snow pushed up around a footprint, share of the snow depth (0..1)
SnowFootprintRim=0.3

; How far from the camera footprints are drawn, yards (4..32); they also end 24 to 32 yards from your character
SnowFootprintRadius=28

; Distance over which footprints fade out one by one toward that limit, yards (1..16)
SnowFootprintFade=8


; ============================================================================
; Debug and log
; ============================================================================
; 0 = off, 1 = fog radiance only, 2 = transmittance, 3 = linear depth, 4 = where the full-resolution fog comes
; from: blue = low-resolution fog at the same depth, green = low-resolution fog between its texels,
; red = marched again for this pixel (the expensive case)
DebugView=0
; Red marker where the sun direction projects on screen
SunMarker=0
; 0 = errors, 1 = info, 2 = debug
LogLevel=1
